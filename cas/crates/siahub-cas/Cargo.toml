[package]
name                   = "siahub-cas"
version                = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true

[[bin]]
name = "siahub-cas"
path = "src/main.rs"

[features]
default  = []
# Enables the in-memory MockSiaAdapter escape hatch (SIAHUB_SIA_MOCK=true).
# Dev-only; notes.md forbids running the binary with this feature in prod.
sia-mock = ["siahub-cas-storage/sia-mock"]

[dependencies]
axum               = { workspace = true }
tokio              = { workspace = true }
tower              = { workspace = true }
tower-http         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
serde              = { workspace = true }
anyhow             = { workspace = true }
base64             = { workspace = true }
envy               = { workspace = true }
thiserror          = { workspace = true }
sqlx               = { workspace = true }
fred               = { workspace = true }
sia_storage        = { workspace = true }
# Plan 04-01 — shared reqwest client for OAuth token exchange + indexd proxy.
# default-features off + rustls-tls keeps the TLS stack consistent with
# sqlx/fred's rustls choice (no native openssl dep).
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url                = "2"
siahub-cas-core    = { path = "../siahub-cas-core" }
siahub-cas-db      = { path = "../siahub-cas-db" }
siahub-cas-storage = { path = "../siahub-cas-storage" }
