[package]
name                   = "openweights-cas-storage"
version                = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true

[features]
default  = []
sia-mock = []   # enabled by the conformance crate;

[dependencies]
sia_storage      = { workspace = true }
tokio            = { workspace = true }
thiserror        = { workspace = true }
tracing          = { workspace = true }
bytes            = { workspace = true }
anyhow           = { workspace = true }
async-trait      = "0.1"
sha2             = { workspace = true }
sqlx             = { workspace = true }

[dev-dependencies]
# db-backed reconciler sweep tests spin a throwaway postgres in docker. same
# versions the conformance crate pins. tests skip cleanly when docker is absent.
testcontainers         = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
