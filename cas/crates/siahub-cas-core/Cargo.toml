[package]
name                   = "siahub-cas-core"
version                = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true

[dependencies]
axum               = { workspace = true }
tokio              = { workspace = true }
tower              = { workspace = true }
tower-http         = { workspace = true }
http               = { workspace = true }
http-body-util     = "0.1"
hyper              = { workspace = true }
bytes              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }
uuid               = { workspace = true }
chrono             = { workspace = true }
sha2               = { workspace = true }
hmac               = { workspace = true }
base64             = { workspace = true }
tracing            = { workspace = true }
fred               = { workspace = true }
sqlx               = { workspace = true }
lru                = "0.12"
async-trait        = "0.1"
url                = "2"
subtle             = "2"
prometheus         = { version = "0.13", default-features = false }
siahub-cas-proto   = { path = "../siahub-cas-proto" }
siahub-cas-db      = { path = "../siahub-cas-db" }
siahub-cas-storage = { path = "../siahub-cas-storage" }

[dev-dependencies]
# Plan 02-04 Task 5 — P1 canary + P2 short-circuit + happy-path fixtures.
# The `sia-mock` feature on siahub-cas-storage flips in the in-memory
# MockSiaAdapter (Sia call counters + inject_unavailable).
siahub-cas-storage = { path = "../siahub-cas-storage", features = ["sia-mock"] }
tokio              = { workspace = true, features = ["macros", "test-util"] }
bytes              = { workspace = true }
# Plan 02-06 — P4 golden snapshot for fetch_info coalescing.
insta              = { version = "1", features = ["json"] }
