[package]
name                   = "openweights-cas-core"
version                = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true

[dependencies]
axum               = { workspace = true }
tokio              = { workspace = true }
tower              = { workspace = true }
tower-http         = { workspace = true }
http               = { workspace = true }
http-body-util     = "0.1"
hyper              = { workspace = true }
bytes              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }
uuid               = { workspace = true }
chrono             = { workspace = true }
sha2               = { workspace = true }
hmac               = { workspace = true }
base64             = { workspace = true }
tracing            = { workspace = true }
fred               = { workspace = true }
sqlx               = { workspace = true }
lru                = "0.12"
async-trait        = "0.1"
url                = "2"
subtle             = "2"
prometheus         = { version = "0.13", default-features = false }
# ( amendment) — GitHub OAuth token exchange + indexd
# proxy for /admin/stats/map. default-features off keeps the tls stack
# consistent with sqlx/fred's rustls choice.
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
#URL-safe random nonce generation for OAuth state + session
# IDs + API-key plaintext. CSPRNG via getrandom (already transitive).
getrandom          = "0.2"
openweights-cas-proto   = { path = "../openweights-cas-proto" }
openweights-cas-db      = { path = "../openweights-cas-db" }
openweights-cas-storage = { path = "../openweights-cas-storage" }

[dev-dependencies]
# Task 5 — canary + short-circuit + happy-path fixtures.
# The `sia-mock` feature on openweights-cas-storage flips in the in-memory
# MockSiaAdapter (Sia call counters + inject_unavailable).
openweights-cas-storage = { path = "../openweights-cas-storage", features = ["sia-mock"] }
tokio              = { workspace = true, features = ["macros", "test-util"] }
bytes              = { workspace = true }
#golden snapshot for fetch_info coalescing.
insta              = { version = "1", features = ["json"] }
