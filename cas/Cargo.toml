[workspace]
resolver = "2"
members  = [
    "crates/openweights-cas",
    "crates/openweights-cas-core",
    "crates/openweights-cas-storage",
    "crates/openweights-cas-db",
    "crates/openweights-cas-proto",
    "crates/openweights-cas-register",
]

[workspace.package]
edition      = "2024"
rust-version = "1.85"
publish      = false
license      = "MIT"

[workspace.dependencies]
# Protocol types (.md §1 — NEVER fork; re-export only via openweights-cas-proto).
# crates.io publishes this crate with a hyphenated name; the Rust
# import identifier is `xet_core_structures`. The README of the crate disclaims
# public use, but /2 policy is to pin exact and live within the
# structures-only subset.
xet-core-structures = "=1.5.2"

# Runtime
axum       = "0.8"
tokio      = { version = "1.50", features = ["full"] }
tokio-util = "0.7"
tower      = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
hyper      = "1"
http       = "1"

# Data
sqlx  = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "uuid", "chrono", "json"] }
fred  = { version = "10", default-features = false, features = ["enable-rustls", "i-std", "i-scripts", "transactions"] }

# Storage
sia_storage = "=0.7.0"

# Utility
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"
anyhow     = "1"
uuid       = { version = "1", features = ["v4", "v7", "serde"] }
chrono     = { version = "0.4", features = ["serde"] }
sha2       = "0.10"
hmac       = "0.12"
base64     = "0.22"
bytes      = "1"

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
envy = "0.4"

# Dev-only — pinned in conformance/ crate, NOT in any cas/ crate runtime.
# xet_client = "=1.5.1" # conformance/ only
# testcontainers = "0.22" # conformance/ only
# insta = "1" # conformance/ only

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"

# OpenWeights patch over upstream sia_storage 0.7.0:
# upstream UploadOptions::validate hard-codes RECOVERY_PROBABILITY=0.75 (a
# conservative mainnet adversarial assumption). For our Zen testnet demo
# the active host pool sustains ~95% uptime and we form ~6 contracts;
# strict 0.75 would force ≥12 hosts to clear the 99.99% recovery
# threshold and we'd never pin. The vendored copy bumps the constant to
# 0.90 with a comment + math derivation in-place. Diff is one constant
# only — no behavioral, API, or correctness change beyond admitting a
# 2-of-6 erasure scheme.
[patch.crates-io]
sia_storage = { path = "vendored/sia_storage" }
