name: docs

# Build the docs site (Next.js static export) and deploy it to GitHub Pages.
# Runs on pushes to main that touch docs-site, and can be triggered manually.
# Enable once in the repo: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer run supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        run: npm ci || npm install
      - name: build (static export under the repo subpath)
        # ${{ github.event.repository.name }} = OpenWeights, so the site is
        # served correctly at bytemaster333.github.io/OpenWeights.
        run: PAGES_BASE_PATH="/${{ github.event.repository.name }}" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
