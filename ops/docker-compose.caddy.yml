#Caddy CI overlay.
# Stacks on top of `ops/docker-compose.yml` + `ops/docker-compose.ci.yml`:
# docker compose \
# -f ops/docker-compose.yml \
# -f ops/docker-compose.ci.yml \
# -f ops/docker-compose.caddy.yml \
# up -d
# Adds a single Caddy reverse proxy on :8090 that fans out to CAS + gateway +
# console via path prefixes (see ops/Caddyfile.ci). (HTTP/2 Range header
# integrity through a reverse proxy) is exercised here on the exact code path
# the production deploy will carry.
# Prod (05-04) will ship a separate ops/Caddyfile + ops/docker-compose.yml
# Caddy service block (dual-SAN auto Let's Encrypt on `openweights.app` +
# `cas.openweights.app`); this overlay exists only for CI so PR reviewers + nightly
# round-trip runs hit the same multi-range integrity guarantees.

services:
  caddy:
    image: caddy:2.8
    container_name: openweights-caddy-ci
    depends_on:
      openweights-cas:
        condition: service_healthy
      openweights-gateway:
        condition: service_healthy
      openweights-console:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./Caddyfile.ci:/etc/caddy/Caddyfile:ro
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/cas/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: "no"
