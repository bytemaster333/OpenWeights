# Task 2 — CI-only overlay.
# Merged with ops/docker-compose.yml via
# `docker compose -f ops/docker-compose.yml -f ops/docker-compose.ci.yml up`
# Purpose:
# (a) Assert V2_RECONSTRUCTION_ENABLED=true at the service level ( CI
# half — even if.env ever drifts to `false`, the CI overlay pins
# true).
# (b) Raise logging verbosity on the Rust + Go services so CI failure
# mode diagnosis has enough signal. The indexer is external
# (OPENWEIGHTS_INDEXER_URL); conformance tests use testcontainers for the
# CAS+Postgres they actually hit.

services:
  openweights-cas:
    environment:
      V2_RECONSTRUCTION_ENABLED: "true"
      RUST_LOG: info

  openweights-gateway:
    environment:
      # gateway reads GATEWAY_LOG_LEVEL via config.go firstNonEmpty.
      GATEWAY_LOG_LEVEL: info

  openweights-console:
    environment:
      VITE_V2_RECONSTRUCTION_ENABLED: "true"
