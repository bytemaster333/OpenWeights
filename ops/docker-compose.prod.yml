# ops/docker-compose.prod.yml — Production overlay for a hosted deployment.
# Compose with:
#   docker compose -f ops/docker-compose.yml -f ops/docker-compose.prod.yml \
#     --env-file .env up -d
#
# Differences from the base (dev/CI) compose:
# 1. Adds a `caddy` service bound to 0.0.0.0:80 + 0.0.0.0:443 (ONLY public ports)
#    with automatic HTTPS.
# 2. Drops the base file's `127.0.0.1:<x>:<y>` port mappings to `expose:` so
#    CAS/gateway/console/Postgres/Redis are reachable only on the Compose
#    network — Caddy proxies CAS + gateway + console; Postgres/Redis are internal.
# 3. Derives every public URL from a SINGLE knob, OPENWEIGHTS_DOMAIN (e.g.
#    example.com), so a different domain needs only that one .env value (plus
#    DNS + OPENWEIGHTS_ACME_EMAIL). The console lives on the apex, the CAS +
#    gateway on cas.<domain>.
# 4. `restart: unless-stopped` on every service — reboot-resilient.
#
# There is no bundled indexer: OPENWEIGHTS_INDEXER_URL points at an external one
# (https://sia.storage or your own indexd), same as the base compose.

services:

  caddy:
    image: caddy:2.8
    container_name: openweights-caddy
    # Caddy cannot start until the upstreams are ready to accept proxied
    # traffic — otherwise the first ACME challenge races.
    depends_on:
      openweights-cas:      { condition: service_healthy }
      openweights-gateway:  { condition: service_healthy }
      openweights-console:  { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist ACME account + issued cert + on-disk OCSP cache across
      # container restarts. WITHOUT this Let's Encrypt re-issues certs on
      # every deploy, which quickly trips the 5/week rate limit.
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # The one domain knob. Caddy serves <domain> (console) + cas.<domain>
      # (CAS + gateway) on one dual-SAN cert. Must have DNS pointing here.
      OPENWEIGHTS_DOMAIN: ${OPENWEIGHTS_DOMAIN:?must be set in .env (e.g. example.com)}
      OPENWEIGHTS_ACME_EMAIL: ${OPENWEIGHTS_ACME_EMAIL:?must be set in .env for Let's Encrypt}
    restart: unless-stopped

  # ─── openweights-cas: internal-only; public URLs derived from the domain ─────
  openweights-cas:
    ports: !reset []
    expose:
      - "8080"
    environment:
      V2_RECONSTRUCTION_ENABLED: "true"
      # All public URLs derive from OPENWEIGHTS_DOMAIN so one knob configures prod.
      CONSOLE_BASE_URL: https://${OPENWEIGHTS_DOMAIN:-example.com}
      CAS_PUBLIC_URL: https://cas.${OPENWEIGHTS_DOMAIN:-example.com}
      OPENWEIGHTS_CAS_PUBLIC_URL: https://cas.${OPENWEIGHTS_DOMAIN:-example.com}
      GATEWAY_BASE_URL: https://cas.${OPENWEIGHTS_DOMAIN:-example.com}/gateway
      GITHUB_OAUTH_CALLBACK_URL: https://cas.${OPENWEIGHTS_DOMAIN:-example.com}/auth/github/callback
    restart: unless-stopped

  # ─── openweights-gateway: internal-only; base URL must match the CAS ─────────
  openweights-gateway:
    ports: !reset []
    expose:
      - "8081"
    environment:
      GATEWAY_BASE_URL: https://cas.${OPENWEIGHTS_DOMAIN:-example.com}/gateway
    restart: unless-stopped

  # ─── openweights-console: internal-only; runtime config points at the domain ─
  openweights-console:
    ports: !reset []
    expose:
      - "80"
    environment:
      # Baked into /config.js at container start so the browser talks to the
      # public CAS/gateway origins (not localhost).
      OPENWEIGHTS_CONSOLE_CAS_URL: https://cas.${OPENWEIGHTS_DOMAIN:-example.com}
      OPENWEIGHTS_CONSOLE_GATEWAY_URL: https://cas.${OPENWEIGHTS_DOMAIN:-example.com}/gateway
      OPENWEIGHTS_CONSOLE_HF_PROXY_URL: https://cas.${OPENWEIGHTS_DOMAIN:-example.com}
    restart: unless-stopped

  # ─── hf-proxy: internal-only; rewrites X-Xet-Cas-Url to the public CAS ───────
  openweights-hf-proxy:
    ports: !reset []
    expose:
      - "28090"
    environment:
      OPENWEIGHTS_CAS_PUBLIC_URL: https://cas.${OPENWEIGHTS_DOMAIN:-example.com}
    restart: unless-stopped

  # ─── Postgres: loopback-only in prod (Caddy has no reason to reach it) ─────
  postgres:
    ports: !reset []
    expose:
      - "5432"
    restart: unless-stopped

  # ─── Redis: loopback-only in prod ──────────────────────────────────────────
  redis:
    ports: !reset []
    expose:
      - "6379"
    restart: unless-stopped

volumes:
  caddy-data:
    name: openweights-caddy-data
  caddy-config:
    name: openweights-caddy-config
